   <div><p class="eyebrow">An invitation to return</p><h1 id="stop">STOP<span>.</span></h1><p class="seat">Take a seat right over there.</p></div>

   <div class="label">A thought to sit with</div>

 <footer class="bottom"><p>An impulse is a moment.<br>It does not have to become a direction.</p><div class="source">A moment for yourself · Quotes by <a href="https://zenquotes.io/" rel="noreferrer">ZenQuotes</a></div></footer>
